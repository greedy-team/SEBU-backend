name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a push while it is publishing the deployment pointer.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Verify pull deployment scripts
        shell: bash
        run: |
          python3 -m unittest discover -s ops/deploy/tests -v
          for script in ops/deploy/*.sh; do bash -n "$script"; done

      - name: Build and test
        run: ./gradlew clean test --no-daemon

      - name: Build runtime container
        run: docker build --tag sebu-backend:ci .

      - name: Smoke test prod image with disposable MySQL 8.0
        run: bash ops/deploy/smoke-prod.sh sebu-backend:ci

  publish:
    name: Publish private ${{ github.ref_name }} image
    needs: test
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOYMENT_CHANNEL: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Refuse an existing public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/deploy/check-package-private.py --allow-missing

      - name: Build image with commit and migration identity
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_CHANNEL" in develop|main) ;; *) exit 1 ;; esac
          migrations=$(python3 ops/deploy/deploy.py fingerprint)
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/greedy-team/SEBU-backend" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.sebu.deployment-channel=$DEPLOYMENT_CHANNEL" \
            --label "io.sebu.migrations-sha256=$migrations" \
            --tag "ghcr.io/greedy-team/sebu-backend:$DEPLOYMENT_CHANNEL-sha-$GITHUB_SHA" .

      - name: Validate exact publish image with MySQL 8.0
        run: bash ops/deploy/smoke-prod.sh "ghcr.io/greedy-team/sebu-backend:$DEPLOYMENT_CHANNEL-sha-$GITHUB_SHA"

      - name: Publish private image, then advance the matching branch pointer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/greedy-team/sebu-backend
          python3 ops/deploy/check-package-private.py --allow-missing
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          # Branch-qualified SHA tags cannot overwrite each other's channel metadata.
          docker push "$image:$DEPLOYMENT_CHANNEL-sha-$GITHUB_SHA"
          python3 ops/deploy/check-package-private.py
          current_branch=$(git ls-remote origin "refs/heads/$DEPLOYMENT_CHANNEL" | cut -f1)
          if [[ "$current_branch" != "$GITHUB_SHA" ]]; then
            echo 'Branch HEAD changed. SHA image retained; deployment pointer not changed.'
            exit 0
          fi
          docker tag "$image:$DEPLOYMENT_CHANNEL-sha-$GITHUB_SHA" "$image:$DEPLOYMENT_CHANNEL"
          docker push "$image:$DEPLOYMENT_CHANNEL"
          echo "Private $DEPLOYMENT_CHANNEL image published for commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
