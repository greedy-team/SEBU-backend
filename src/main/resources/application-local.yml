spring:
  datasource:
    url: jdbc:h2:mem:sebu;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/local

app:
  auth:
    csrf:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:8080
    cookie:
      secure: false

